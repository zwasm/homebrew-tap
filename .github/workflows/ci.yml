# Install the formula for real on every change. The formula is hand-edited on
# each zwasm release (three urls, three sha256 values), and a wrong checksum or
# a renamed asset is invisible until a user hits it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@962acc985cf741e4f7a112a3cfa6194386b63edf

      # `brew install <path>` is rejected ("Homebrew requires formulae to be in
      # a tap"), so graft this checkout in as the tap. That also means the
      # install below is the exact command a user runs.
      - name: Tap this checkout
        run: |
          tap_dir="$(brew --repository)/Library/Taps/zwasm/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew tap-info zwasm/tap

      - name: Lint the formula
        run: brew style zwasm/tap

      - name: Install
        run: brew install --verbose zwasm/tap/zwasm

      - name: Run it
        run: zwasm --version

  ci-required:
    name: ci-required
    needs: [install]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          if [ "${{ needs.install.result }}" != "success" ]; then
            echo "install did not succeed: ${{ needs.install.result }}"
            exit 1
          fi
